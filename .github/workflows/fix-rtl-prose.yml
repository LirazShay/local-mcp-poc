name: Fix mixed RTL prose

on:
  push:
    paths:
      - 'scripts/fix-rtl-prose.mjs'
      - '.github/workflows/fix-rtl-prose.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite mixed RTL prose
        run: node scripts/fix-rtl-prose.mjs
      - name: Commit documentation fixes
        run: |
          if git diff --quiet -- README.md docs/CHATGPT_TEST_PROMPT.md; then
            echo "No RTL prose changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CHATGPT_TEST_PROMPT.md
          git commit -m "Render Hebrew prompt lists correctly on GitHub"
          git push
