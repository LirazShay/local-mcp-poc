name: Apply RTL README formatting

on:
  push:
    paths:
      - 'scripts/apply-rtl-readme.mjs'
      - '.github/workflows/apply-rtl-readme.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply RTL formatting
        run: node scripts/apply-rtl-readme.mjs
      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Apply stable RTL formatting to README"
          git push
